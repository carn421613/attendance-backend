<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="#">Dashboard</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="card" style="max-width:700px; width:100%;">

    <h2 style="text-align:center; margin-bottom:20px;">
      🎓 Student Dashboard
    </h2>

    <p style="text-align:center; color:#ccc; margin-bottom:25px;">
      Access your profile, courses, and attendance insights
    </p>

    <!-- MENU GRID -->
    <div class="row">

      <button onclick="goToProfile()">👤 My Profile</button>

      <button onclick="goToEnroll()">📚 Course Enrollment</button>

      <button onclick="goToAnalytics()">📊 Attendance Analytics</button>

      <button onclick="logout()" style="background:#c62828;">
        🚪 Logout
      </button>

    </div>

  </div>

</div>

<!-- =========================
     LOGIC (UNCHANGED)
========================= -->
<script type="module">
import { protectPage } from "../js/auth-guard.js";

protectPage("student");

window.goToProfile = function() {
  window.location.href = "student-profile.html";
};

window.goToEnroll = function() {
  window.location.href = "enroll.html";
};

window.goToAnalytics = function() {
  window.location.href = "student-analytics.html";
};
</script>

<script type="module" src="../js/logout.js"></script>

<!-- =========================
     CHATBOT
========================= -->

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<df-messenger
  chat-title="Attendance Assistant"
  agent-id="61918f9d-50f2-415b-aca8-7c6a361fc675"
  language-code="en">
</df-messenger>

<script type="module">
import { auth } from "../js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (user) {
    const waitForMessenger = setInterval(() => {
      const messenger = document.querySelector("df-messenger");
      if (messenger && messenger.shadowRoot) {
        clearInterval(waitForMessenger);
        messenger.setAttribute("session-id", user.uid);
      }
    }, 300);
  }
});
</script>

</body>
</html>
