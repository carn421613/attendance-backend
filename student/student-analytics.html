<!DOCTYPE html>
<html>

<head>
  <title>Student - Attendance Analytics</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>

    .analytics-container {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
      position: relative;
      z-index: 1;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
    }

    /* BACK BUTTON */
    .nav-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid white;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .nav-btn:hover {
      background: white;
      color: #1e3c72;
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: white;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #ddd;
    }

    .stat-card p {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* CHART */
    .chart-section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      color: white;
    }

    .chart-container {
      height: 300px;
    }

    /* COURSES */
    .courses-section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      color: white;
    }

    .course-list {
      list-style: none;
      padding: 0;
    }

    .course-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .attendance-pill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #2e7d32;
      color: white;
    }

    .attendance-pill.danger {
      background: #c62828;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- BACKGROUND EFFECT -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<div class="analytics-container">

  <button class="nav-btn" onclick="location.href='student_dashboard.html'">
    ← Back to Dashboard
  </button>

  <h1>📊 Attendance Analytics</h1>

  <!-- STATS -->
  <div class="stats-grid">

    <div class="stat-card">
      <h3>Overall Attendance</h3>
      <p id="overallAttendance">-</p>
    </div>

    <div class="stat-card">
      <h3>Total Courses</h3>
      <p id="totalCourses">-</p>
    </div>

    <div class="stat-card">
      <h3>Total Sessions</h3>
      <p id="totalSessions">-</p>
    </div>

  </div>

  <!-- CHART -->
  <div class="chart-section">
    <h3>Course-wise Attendance</h3>
    <div class="chart-container">
      <canvas id="attendanceChart"></canvas>
    </div>
  </div>

  <!-- COURSE LIST -->
  <div class="courses-section">
    <h3>Courses</h3>
    <ul class="course-list" id="coursesList">
      <li>Loading...</li>
    </ul>
  </div>

</div>

<!-- =========================
     SCRIPT (UNCHANGED)
========================= -->
<script type="module">

import { auth } from "../js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const token = await user.getIdToken(true);
  fetchStudentAnalytics(token, user.uid);
});

async function fetchStudentAnalytics(token, uid) {
  try {
    const url = "https://attendance-backend-qj36.onrender.com";

    const res = await fetch(`${url}/student/analytics/${uid}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!res.ok) throw new Error("Failed to load analytics");

    const data = await res.json();

    renderStudentStats(data);

  } catch (err) {
    console.error(err);
    document.getElementById("coursesList").innerHTML =
      `<li style='color:red;'>Error loading analytics</li>`;
  }
}

function renderStudentStats(data) {

  document.getElementById("overallAttendance").innerText =
    data.overallAttendance !== undefined
      ? `${data.overallAttendance.toFixed(1)}%`
      : "-";

  document.getElementById("totalCourses").innerText =
    data.courses ? data.courses.length : "-";

  document.getElementById("totalSessions").innerText =
    data.totalSessions !== undefined ? data.totalSessions : "-";

  const courseNames = (data.courses || []).map(c => c.name);
  const courseAttendance = (data.courses || []).map(c => c.attendance || 0);

  renderChart(courseNames, courseAttendance);

  const list = document.getElementById("coursesList");

  list.innerHTML = data.courses.map(course => `
    <li>
      <span>${course.name}</span>
      <span class="attendance-pill ${course.attendance < 75 ? 'danger' : ''}">
        ${course.attendance.toFixed(1)}%
      </span>
    </li>
  `).join("");
}

let chartInstance = null;

function renderChart(labels, dataPoints) {

  const ctx = document.getElementById('attendanceChart').getContext('2d');

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Attendance (%)',
        data: dataPoints,
        backgroundColor: dataPoints.map(v => v >= 75 ? '#4caf50' : '#e53935')
      }]
    },
    options: {
  responsive: true,
  maintainAspectRatio: false,

  plugins: {
    legend: {
      labels: {
        color: "#ffffff"   // legend text
      }
    }
  },

  scales: {
    x: {
      ticks: {
        color: "#ffffff"   // 🔥 SUBJECT NAMES
      }
    },
    y: {
      beginAtZero: true,
      max: 100,
      ticks: {
        color: "#ffffff",  // 🔥 0–100 NUMBERS
        stepSize: 10
      }
    }
  }
}
  });
}

</script>

</body>
</html>
