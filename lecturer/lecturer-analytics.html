<!DOCTYPE html>
<html>

<head>
  <title>Admin - Analytics Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .analytics-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .analytics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .analytics-header h1 {
      color: white;
      margin: 0;
    }

    .nav-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid white;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: white;
      color: #1f3c88;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-card p {
      font-size: 28px;
      font-weight: bold;
    }

    .chart-section,
    .classes-section {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

<div class="analytics-container">

  <div class="analytics-header">
    <h1>📊 Admin Analytics</h1>
    <button class="nav-btn" onclick="location.href='dashboard.html'">
      ← Back
    </button>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Users</h3>
      <p id="totalUsers">-</p>
    </div>
    <div class="stat-card">
      <h3>Students</h3>
      <p id="totalStudents">-</p>
    </div>
    <div class="stat-card">
      <h3>Lecturers</h3>
      <p id="totalLecturers">-</p>
    </div>
    <div class="stat-card">
      <h3>Courses</h3>
      <p id="totalCourses">-</p>
    </div>
  </div>

  <!-- CHART -->
  <div class="chart-section">
    <h3>Course-wise Attendance</h3>
    <canvas id="attendanceChart"></canvas>
  </div>

  <!-- CLASS DATA -->
  <div class="classes-section">
    <h3>Class Diagnostics</h3>
    <div id="classesList">Loading...</div>
  </div>

</div>

<script type="module">
import { auth } from "../js/firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const token = await user.getIdToken(true);
  fetchAnalytics(token);
});

async function fetchAnalytics(token) {
  try {

    // ✅ FIXED BACKEND URL (MAIN FIX)
    const url = "https://attendance-backend-qj36.onrender.com";

    const res = await fetch(`${url}/admin/analytics`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!res.ok) throw new Error("API failed");

    const data = await res.json();
    renderData(data);

  } catch (err) {
    console.error(err);
    document.getElementById("classesList").innerHTML =
      `<p style="color:red;">Error loading analytics</p>`;
  }
}

function renderData(data) {

  // STATS
  document.getElementById("totalUsers").innerText = data.totalUsers || 0;
  document.getElementById("totalStudents").innerText = data.totalStudents || 0;
  document.getElementById("totalLecturers").innerText = data.totalLecturers || 0;
  document.getElementById("totalCourses").innerText = data.totalCourses || 0;

  const classes = data.classesAnalytics || [];

  if (classes.length === 0) {
    document.getElementById("classesList").innerHTML =
      "<p>No data available</p>";
    return;
  }

  // CHART DATA
  const labels = classes.map(c => c.course || "Course");
  const values = classes.map(c => c.classAverageAttendance || 0);

  const ctx = document.getElementById("attendanceChart");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: "rgba(31,60,136,0.7)"
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          max: 100
        }
      }
    }
  });

  // CLASS LIST
  let html = "";

  classes.forEach(c => {
    html += `
      <div style="margin-bottom:15px;">
        <strong>${c.course}</strong> → ${c.classAverageAttendance.toFixed(1)}%
      </div>
    `;
  });

  document.getElementById("classesList").innerHTML = html;
}

</script>

</body>
</html>
