<!DOCTYPE html>
<html>
<head>
  <title>Class Attendance Report</title>

  <link rel="stylesheet" href="../css/style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #4b3fa5, #7b3db8, #b06cff);
    margin: 0;
  }

  .report-container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    color: white;
  }

  .report-card {
    background: rgba(31, 42, 68, 0.85);
    border-radius: 16px;
    padding: 30px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
  }

  .filters {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .filter-group {
    flex: 1;
    min-width: 150px;
  }

  label {
    font-size: 13px;
    margin-bottom: 5px;
    display: block;
  }

  select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  select option {
    color: black;
  }

  .btn-group {
    text-align: center;
    margin: 20px 0;
  }

  .load-btn {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: white;
  }

  .pdf-btn {
    background: #2e7d32;
    color: white;
  }

  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin: 5px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    color: white;
  }

  th {
    background: rgba(255,255,255,0.2);
  }

  .present {
    color: #00e676;
    font-weight: bold;
  }

  .absent {
    color: #ff5252;
    font-weight: bold;
  }

  #summary {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
  }
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="lecturer_dashboard.html">Dashboard</a>
</div>

<!-- BACKGROUND -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<!-- MAIN -->
<div class="main">

  <div class="report-container">

    <div class="report-card">

      <h2>📊 Class Attendance Report</h2>

      <!-- FILTERS -->
      <div class="filters">

        <div class="filter-group">
          <label>Course</label>
          <select id="course"></select>
        </div>

        <div class="filter-group">
          <label>Branch</label>
          <select id="branch">
            <option value="CSE">CSE</option>
            <option value="CSM">CSM</option>
            <option value="ECE">ECE</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Year</label>
          <select id="year">
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Semester</label>
          <select id="semester">
            <option value="1">Sem 1</option>
            <option value="2">Sem 2</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Academic Year</label>
          <select id="academicYear">
            <option value="2025-2026">2025-2026</option>
            <option value="2024-2025">2024-2025</option>
          </select>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="btn-group">
        <button class="load-btn" onclick="loadReport()">Load Report</button>
        <button class="pdf-btn" onclick="generatePDF()">Download PDF</button>
      </div>

      <!-- UI TABLE -->
      <table id="reportTable">
        <thead>
          <tr id="headerRow">
            <th>Student</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="summary"></div>

      <!-- 🔥 CLEAN PDF CONTENT -->
      <div id="pdfContent" style="display:none; background:white; color:black; padding:20px;">

        <h2 style="text-align:center;">Class Attendance Report</h2>

        <p><b>Lecturer:</b> <span id="pdfLecturer"></span></p>
        <p><b>Course:</b> <span id="pdfCourse"></span></p>
        <p><b>Branch:</b> <span id="pdfBranch"></span></p>
        <p><b>Year:</b> <span id="pdfYear"></span> |
           <b>Semester:</b> <span id="pdfSemester"></span></p>
        <p><b>Academic Year:</b> <span id="pdfAcademicYear"></span></p>

        <br>

        <table border="1" style="width:100%; border-collapse:collapse; text-align:center; color:black;">
          <thead>
            <tr id="pdfHeaderRow" style="background:#f2f2f2; color: black;">
              <th style="color:black;">Student</th>
            </tr>
          </thead>
          <tbody id="pdfBody"></tbody>
        </table>

        <p id="pdfSummary" style="margin-top:15px; font-weight:bold;"></p>

      </div>

    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

const BASE_URL = "https://attendance-backend-qj36.onrender.com";

/* LOAD COURSES */
async function loadCourses() {
  const res = await fetch(`${BASE_URL}/courses`);
  const courses = await res.json();

  const dropdown = document.getElementById("course");
  dropdown.innerHTML = "";

  courses.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = `${c.name} (${c.id})`;
    dropdown.appendChild(opt);
  });
}

document.addEventListener("DOMContentLoaded", loadCourses);

/* LOAD REPORT */
async function loadReport() {

  const params = new URLSearchParams({
    courseId: document.getElementById("course").value,
    branch: document.getElementById("branch").value,
    year: document.getElementById("year").value,
    semester: document.getElementById("semester").value,
    academicYear: document.getElementById("academicYear").value
  });

  const res = await fetch(`${BASE_URL}/lecturer/class-report?${params}`);
  const data = await res.json();

  // UI TABLE
  const header = document.getElementById("headerRow");
  header.innerHTML = "<th>Student</th>";

  data.sessions.forEach(d => {
    header.innerHTML += `<th>${d}</th>`;
  });

  header.innerHTML += "<th>Avg</th><th>Status</th>";

  const tbody = document.querySelector("#reportTable tbody");
  tbody.innerHTML = "";

  data.students.forEach(s => {
    tbody.innerHTML += `
      <tr>
        <td>${s.name}</td>
        ${s.attendance.map(a => `<td class="${a==="P"?"present":"absent"}">${a}</td>`).join("")}
        <td>${s.avg}%</td>
        <td>${s.status}</td>
      </tr>
    `;
  });

  document.getElementById("summary").innerText =
    `Class Avg: ${data.classAverage}% | Sessions: ${data.totalSessions}`;

  // PDF DATA
  document.getElementById("pdfLecturer").innerText = "Lecturer";
  document.getElementById("pdfCourse").innerText =
    document.getElementById("course").selectedOptions[0]?.text || "";
  document.getElementById("pdfBranch").innerText =
    document.getElementById("branch").value;
  document.getElementById("pdfYear").innerText =
    document.getElementById("year").value;
  document.getElementById("pdfSemester").innerText =
    document.getElementById("semester").value;
  document.getElementById("pdfAcademicYear").innerText =
    document.getElementById("academicYear").value;

  const pdfHeader = document.getElementById("pdfHeaderRow");

  pdfHeader.innerHTML = "<th style='color:black; background:#f2f2f2;'>Student</th>";

  data.sessions.forEach(d => {
  pdfHeader.innerHTML += `<th style="color:black;">${d}</th>`;
});

 pdfHeader.innerHTML += `
  <th style="color:black;">Avg</th>
  <th style="color:black;">Status</th>
`;

  const pdfBody = document.getElementById("pdfBody");
  pdfBody.innerHTML = "";

  data.students.forEach(s => {
    pdfBody.innerHTML += `
      <tr>
        <td style="color:black;">${s.name}</td>
        ${s.attendance.map(a => `<td style="color:black;">${a}</td>`).join("")}
        <td style="color:black;">${s.avg}%</td>
        <td style="color:black;">${s.status}</td>
      </tr>
    `;
  });

  document.getElementById("pdfSummary").innerText =
    `Class Avg: ${data.classAverage}% | Sessions: ${data.totalSessions}`;
}

/* PDF */
function generatePDF() {
  const element = document.getElementById("pdfContent");

  element.style.display = "block";

  html2pdf().set({
    margin: 10,
    filename: "attendance_report.pdf",
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
  }).from(element).save().then(() => {
    element.style.display = "none";
  });
}

</script>

</body>
</html>
