<!DOCTYPE html>
<html>
<head>
  <title>Class Attendance Report</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .container {
      max-width: 1100px; /* slightly increased */
      margin: auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    /* ✅ FORM GROUP */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      padding: 8px;
    }

    button {
      margin: 10px 5px;
      padding: 8px 12px;
    }

    /* ✅ TABLE IMPROVED */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      table-layout: auto;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px; /* increased spacing */
      text-align: center;
      min-width: 90px; /* prevents congestion */
    }

    th {
      background: #f2f2f2;
    }

    /* ✅ DATE HEADERS SPACE */
    #headerRow th {
      white-space: nowrap;
    }

    /* ✅ SCROLL IF MANY DATES */
    #reportContainer {
      overflow-x: auto;
    }

    #summary {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>Class Attendance Report</h2>

  <!-- ✅ FILTERS WITH LABELS -->

  <div class="form-group">
    <label>Course</label>
    <select id="course"></select>
  </div>

  <div class="form-group">
    <label>Branch</label>
    <select id="branch">
      <option value="CSE">CSE</option>
      <option value="CSM">CSM</option>
      <option value="ECE">ECE</option>
    </select>
  </div>

  <div class="form-group">
    <label>Year</label>
    <select id="year">
      <option value="4">4</option>
      <option value="3">3</option>
      <option value="2">2</option>
      <option value="1">1</option>
    </select>
  </div>

  <div class="form-group">
    <label>Semester</label>
    <select id="semester">
      <option value="1">Semester 1</option>
      <option value="2">Semester 2</option>
    </select>
  </div>

  <div class="form-group">
    <label>Academic Year</label>
    <select id="academicYear">
      <option value="2025-2026">2025-2026</option>
      <option value="2024-2025">2024-2025</option>
    </select>
  </div>

  <!-- BUTTONS -->
  <button onclick="loadReport()">Load Report</button>
  <button onclick="downloadPDF()">Download PDF</button>

  <!-- REPORT -->
  <div id="reportContainer">

    <table id="reportTable">
      <thead>
        <tr id="headerRow">
          <th>Student</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="summary"></div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

const BASE_URL = "https://attendance-backend-qj36.onrender.com";

/* LOAD COURSES */
async function loadCourses() {
  const res = await fetch(`${BASE_URL}/courses`);
  const courses = await res.json();

  const dropdown = document.getElementById("course");

  dropdown.innerHTML = "";

  courses.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = `${c.name} (${c.id})`;
    dropdown.appendChild(opt);
  });
}

document.addEventListener("DOMContentLoaded", loadCourses);

/* LOAD REPORT */
async function loadReport() {

  const params = new URLSearchParams({
    courseId: document.getElementById("course").value,
    branch: document.getElementById("branch").value,
    year: document.getElementById("year").value,
    semester: document.getElementById("semester").value,
    academicYear: document.getElementById("academicYear").value
  });

  const res = await fetch(`${BASE_URL}/lecturer/class-report?${params}`);
  const data = await res.json();

  console.log("DATA:", data);

  const header = document.getElementById("headerRow");
  header.innerHTML = "<th>Student</th>";

  data.sessions.forEach(d => {
    const th = document.createElement("th");
    th.textContent = d;
    header.appendChild(th);
  });

  header.innerHTML += "<th>Avg</th><th>Status</th>";

  const tbody = document.querySelector("#reportTable tbody");
  tbody.innerHTML = "";

  data.students.forEach(s => {

    const row = document.createElement("tr");

    row.innerHTML =
      `<td>${s.name}</td>` +
      s.attendance.map(a =>
        `<td style="color:${a==="P"?"green":"red"};font-weight:bold">${a}</td>`
      ).join("") +
      `<td>${s.avg}%</td>` +
      `<td>${s.status}</td>`;

    tbody.appendChild(row);

  });

  document.getElementById("summary").innerText =
    `Class Avg: ${data.classAverage}% | Sessions: ${data.totalSessions}`;
}

/* PDF */
function downloadPDF() {
  html2pdf().from(document.getElementById("reportContainer")).save();
}

</script>

</body>
</html>
