<!DOCTYPE html>
<html>
<head>
  <title>Lecturer Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #4b3fa5, #7b3db8, #b06cff);
}

</style>
<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="#">Dashboard</a>
</div>

<!-- BACKGROUND -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<!-- MAIN -->
<div class="main">

  <div class="card" style="max-width:700px; width:100%;">

    <h2 style="text-align:center; margin-bottom:20px;">
      👨‍🏫 Lecturer Dashboard
    </h2>

    <p style="text-align:center; color:#ccc; margin-bottom:25px;">
      Manage classes, attendance, and reports efficiently
    </p>

    <!-- MENU GRID -->
    <div class="row">

      <button onclick="goToUpload()">📸 Upload Class Photo</button>

      <button onclick="goToAnalytics()">📊 Attendance Analytics</button>

      <button onclick="goToReports()">📄 Class Reports</button>

      <button onclick="logout()" style="background:#c62828;">
         Logout
      </button>

    </div>

  </div>

</div>

<!-- =========================
     LOGIC (UNCHANGED)
========================= -->
<script type="module">

import { protectPage } from "../js/auth-guard.js";

/* protect lecturer pages */
protectPage("lecturer");

window.goToUpload = function() {
  window.location.href = "upload.html";
};

window.goToAnalytics = function() {
  window.location.href = "lecturer-analytics.html";
};

window.goToReports = function() {
  window.location.href = "class-report.html";
};

</script>

<script type="module" src="../js/logout.js"></script>

<!-- =========================
     CHATBOT
========================= -->

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<df-messenger
  chat-title="Attendance Assistant"
  agent-id="61918f9d-50f2-415b-aca8-7c6a361fc675"
  language-code="en">
</df-messenger>

<script type="module">

import { auth } from "../js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

onAuthStateChanged(auth, (user) => {

  if (user) {

    const waitForMessenger = setInterval(() => {

      const messenger = document.querySelector("df-messenger");

      if (messenger && messenger.shadowRoot) {

        clearInterval(waitForMessenger);

        messenger.setAttribute("session-id", user.uid);

      }

    }, 300);

  }

});

</script>

</body>
</html>
