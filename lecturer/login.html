<!DOCTYPE html>
<html>
<head>
  <title>Lecturer Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #4b3fa5, #7b3db8, #b06cff);
}

</style>
<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="../index.html">About</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="card" style="max-width:400px; margin:auto; text-align:center;">

    <h2 style="margin-bottom:10px;">👩‍🏫 Lecturer Login</h2>
    <p style="margin-bottom:20px; color:#ccc;">Access your dashboard</p>

    <!-- EMAIL -->
    <input 
      id="email" 
      type="email" 
      placeholder="Enter Email"
    >

    <!-- PASSWORD -->
    <input 
      id="password" 
      type="password" 
      placeholder="Enter Password"
    >

    <!-- LOGIN BUTTON -->
    <button id="loginBtn">
      Login
    </button>

  </div>

</div>

<!-- SCRIPTS (DO NOT CHANGE) -->
<script type="module" src="../js/login.js"></script>



<script>
  window.onload = () => {
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  };
</script>

</body>
</html>
