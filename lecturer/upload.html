<!DOCTYPE html>
<html>
<head>
  <title>Upload Class Photo</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4b3fa5, #7b3db8, #b06cff);
      margin: 0;
    }

    /* CONTAINER */
    .upload-container {
      max-width: 600px;
      margin: auto;
      padding: 30px;
      color: white;
    }

    /* CARD */
    .upload-card {
      background: rgba(31, 42, 68, 0.85);
      border-radius: 16px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* FORM */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    select, input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    /* BUTTONS */
    .upload-btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .upload-btn:hover {
      opacity: 0.9;
    }

    .actions-row {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .back-btn {
      flex: 1;
      background: transparent;
      border: 1px solid #4facfe;
      color: #4facfe;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #4facfe;
      color: white;
    }

    .logout-btn {
      flex: 1;
      background: #c62828;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .logout-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="lecturer_dashboard.html">Dashboard</a>
</div>

<!-- BACKGROUND EFFECT -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<!-- MAIN -->
<div class="main">

  <div class="upload-container">

    <div class="upload-card">

      <h2>📸 Upload Class Photo</h2>

      <form onsubmit="event.preventDefault(); uploadClassPhoto();">

        <select id="branch" required>
          <option value="">-- Select Branch --</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
        </select>

        <select id="academicYear" required>
          <option value="">-- Academic Year --</option>
          <option value="2024-2025">2024-2025</option>
          <option value="2025-2026">2025-2026</option>
          <option value="2026-2027">2026-2027</option>
        </select>

        <select id="year" required>
          <option value="">-- Select Year --</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>

        <select id="semester" required>
          <option value="">-- Select Semester --</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
        </select>

        <select id="course" required>
          <option value="">-- Select Course --</option>
        </select>

        <input id="photo" type="file" accept="image/*" required>

        <button type="submit" class="upload-btn">
          ⬆ Upload Photo
        </button>

      </form>

      <!-- ACTION BUTTONS -->
      <div class="actions-row">

        <button class="back-btn"
          onclick="location.href='lecturer_dashboard.html'">
          ← Back to Dashboard
        </button>

        <button class="logout-btn"
          onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>

</div>

<!-- SCRIPTS -->
<script type="module" src="../js/lecturer-upload.js"></script>
<script type="module" src="../js/logout.js"></script>

<script type="module">
  import { protectPage } from "../js/auth-guard.js";
  protectPage("lecturer");
</script>

</body>
</html>
