<!DOCTYPE html>
<html>
<head>
  <title>View Courses</title>
  <link rel="stylesheet" href="../css/style.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #4b3fa5, #7b3db8, #b06cff);
}



    .table-container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      color: white;
    }

    .table-card {
      background: rgba(31, 42, 68, 0.85);
      border-radius: 16px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }

    th {
      color: #ccc;
    }

    tr:hover {
      background: rgba(255,255,255,0.05);
    }

    /* 🔥 BUTTONS */
    .actions-row {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .back-btn {
      flex: 1;
      background: transparent;
      border: 1px solid #4facfe;
      color: #4facfe;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #4facfe;
      color: white;
    }

    .logout-btn {
      flex: 1;
      background: #c62828;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .logout-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Attendance Management</h2>
  <a href="../index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
</div>

<!-- BACKGROUND -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<!-- MAIN -->
<div class="main">

  <div class="table-container">

    <div class="table-card">

      <h2>📚 All Courses</h2>

      <div class="table-wrapper">
        <table id="coursesTable">
          <thead>
            <tr>
              <th>Course Code</th>
              <th>Course Name</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="actions-row">

        <button class="back-btn"
          onclick="location.href='dashboard.html'">
          ← Back to Dashboard
        </button>

        <button class="logout-btn"
          onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</div>

<!-- SCRIPTS -->
<script type="module" src="../js/logout.js"></script>

<script type="module">
import { auth } from "../js/firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const token = await user.getIdToken(true);

  loadCourses(token);
});

async function loadCourses(token) {

  const url = "https://attendance-backend-qj36.onrender.com";

  const res = await fetch(`${url}/courses`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const data = await res.json();

  const tbody = document.querySelector("#coursesTable tbody");

  tbody.innerHTML = data.map(c => `
    <tr>
      <td>${c.id}</td>
      <td>${c.name}</td>
    </tr>
  `).join("");
}
</script>

</body>
</html>
