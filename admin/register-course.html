<!DOCTYPE html>
<html>

<head>
  <title>Register Course</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🎓 CloudAttend</h2>
  <a href="../index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
</div>

<!-- BACKGROUND -->
<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<!-- MAIN -->
<div class="main">

  <div class="card" style="max-width:500px; width:100%;">

    <h2 style="text-align:center; margin-bottom:10px;">
      📘 Register Course
    </h2>

    <p style="text-align:center; color:#ccc; margin-bottom:20px;">
      Add a new course to the system
    </p>

    <!-- FORM -->
    <form id="courseForm">

      <input
        id="courseName"
        type="text"
        placeholder="Enter Course Name"
        required
      >

      <input
        id="courseId"
        type="text"
        placeholder="Enter Course ID (e.g., ML, AI)"
        required
      >

      <button type="submit">
        Register Course
      </button>

    </form>

    <!-- MESSAGE -->
    <p id="formMessage" style="margin-top:15px; text-align:center;"></p>

    <!-- ACTION BUTTONS -->
    <div style="margin-top:20px; display:flex; gap:10px; flex-direction:column;">

      <button onclick="location.href='dashboard.html'">
        ← Back to Dashboard
      </button>

      <button onclick="logout()" style="background:#c62828;">
        🚪 Logout
      </button>

    </div>

  </div>

</div>

<!-- SCRIPTS -->
<script type="module" src="../js/register-course.js"></script>
<script type="module" src="../js/logout.js"></script>

</body>
</html>
